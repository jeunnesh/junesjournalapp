<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>June's Journal</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-[#e8ede9] m-0 p-0 overflow-hidden select-none">
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;
        const { 
            BookOpen, Wallet, Heart, BookMarked, Calendar, 
            Plus, X, Send, Check, ChevronDown, ChevronUp, Edit3, Trash2 
        } = lucide;

        function App() {
            const [activeTab, setActiveTab] = useState('home');
            const [isDialogOpen, setIsDialogOpen] = useState(false);
            const [diaryText, setDiaryText] = useState('');
            const [toastMessage, setToastMessage] = useState(null);

            const showToast = (msg) => {
                setToastMessage(msg);
                setTimeout(function() {
                    setToastMessage(null);
                }, 3000);
            };

            // 日语单词本状态
            const [inputWord, setInputWord] = useState('');
            const [isParsing, setIsParsing] = useState(false);
            const [pendingWord, setPendingWord] = useState(null);
            const [expandedWordId, setExpandedWordId] = useState(null);
            const [noteEditingId, setNoteEditingId] = useState(null);
            const [tempNoteText, setTempNoteText] = useState('');

            const [wordList, setWordList] = useState([
                { id: 1, kanji: '勉強', kana: 'べんきょう', pos: '名 · 名词', meaning: '学习、勤奋', note: '常用于 勉強する (学习)' },
                { id: 2, kanji: '食べる', kana: 'たべる', pos: '他五 · 一段动词', meaning: '吃、生存', note: '' }
            ]);

            // 健康板块状态 (体重单位: 斤)
            const [weightInput, setWeightInput] = useState('');
            const [weightList, setWeightList] = useState([
                { date: '2026-06-01', weight: 114.0 },
                { date: '2026-06-02', weight: 113.8 },
                { date: '2026-06-03', weight: 114.2 },
            ]);

            const [dietInput, setDietInput] = useState('');
            const [dietList, setDietList] = useState([
                { id: 1, time: '今天 08:30', content: '全麦面包 + 美式咖啡' },
                { id: 2, time: '今天 12:40', content: '鸡胸肉沙拉' }
            ]);

            // 日语单词解析
            const handleParseWord = function() {
                if (!inputWord.trim()) return;
                setIsParsing(true);
                setTimeout(function() {
                    setPendingWord({
                        kanji: inputWord,
                        kana: inputWord === '猫' ? 'ねこ' : '假名解析中...',
                        pos: inputWord === '猫' ? '名 · 名词' : '自动识别词性',
                        meaning: inputWord === '猫' ? '猫、猫咪' : '自动识别中文含义',
                    });
                    setIsParsing(false);
                }, 400);
            };

            const handleConfirmWord = function() {
                if (!pendingWord) return;
                var newEntry = Object.assign({ id: Date.now(), note: '' }, pendingWord);
                setWordList([newEntry].concat(wordList));
                setPendingWord(null);
                setInputWord('');
            };

            // 记录体重（同一天覆盖）
            const handleAddWeight = function() {
                var val = parseFloat(weightInput);
                if (isNaN(val)) return;
                var todayStr = new Date().toISOString().split('T')[0];
                
                var existingIndex = -1;
                for (var i = 0; i < weightList.length; i++) {
                    if (weightList[i].date === todayStr) {
                        existingIndex = i;
                        break;
                    }
                }

                if (existingIndex >= 0) {
                    var updated = weightList.slice();
                    updated[existingIndex] = Object.assign({}, updated[existingIndex], { weight: val });
                    setWeightList(updated);
                } else {
                    setWeightList(weightList.concat([{ date: todayStr, weight: val }]));
                }
                setWeightInput('');
                showToast('✨ 体重已更新');
            };

            // 记录饮食
            const handleAddDiet = function() {
                if (!dietInput.trim()) return;
                var nowStr = '今天 ' + new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                var newItem = { id: Date.now(), time: nowStr, content: dietInput.trim() };
                setDietList([newItem].concat(dietList));
                setDietInput('');
                showToast('✨ 饮食已记录');
            };

            // 首页日记 AI 自动解析并抓取体重与饮食
            const handleSaveDiary = function() {
                if (!diaryText.trim()) {
                    setIsDialogOpen(false);
                    return;
                }

                var weightMatch = diaryText.match(/(?:体重)?\s*(\d{2,3}(?:\.\d)?)\s*斤/);
                if (weightMatch) {
                    var val = parseFloat(weightMatch[1]);
                    var todayStr = new Date().toISOString().split('T')[0];
                    var existingIndex = -1;
                    for (var i = 0; i < weightList.length; i++) {
                        if (weightList[i].date === todayStr) {
                            existingIndex = i;
                            break;
                        }
                    }
                    if (existingIndex >= 0) {
                        var updated = weightList.slice();
                        updated[existingIndex] = Object.assign({}, updated[existingIndex], { weight: val });
                        setWeightList(updated);
                    } else {
                        setWeightList(weightList.concat([{ date: todayStr, weight: val }]));
                    }
                }

                if (diaryText.indexOf('吃') >= 0 || diaryText.indexOf('早餐') >= 0 || diaryText.indexOf('午餐') >= 0 || diaryText.indexOf('晚餐') >= 0) {
                    var nowStr = '今天 ' + new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                    var newItem = { id: Date.now(), time: nowStr, content: diaryText.trim() };
                    setDietList([newItem].concat(dietList));
                }

                setIsDialogOpen(false);
                setDiaryText('');
                showToast('✨ 日记已保存，健康数据已同步');
            };

            var today = new Date();
            var formattedDate = today.toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric', year: 'numeric' });
            var latestWeight = weightList.length > 0 ? weightList[weightList.length - 1].weight : '--';

            return (
                <div className="flex justify-center items-center h-[100vh] w-[100vw] bg-[#e8ede9] p-0 md:p-4 font-sans antialiased">
                    <div className="relative w-full h-full md:max-w-md md:h-[844px] bg-[#f8faf8] md:rounded-[40px] shadow-2xl flex flex-col overflow-hidden border-0 md:border-[8px] md:border-emerald-900/10">
                        
                        <div className="h-10 w-full bg-[#f8faf8] shrink-0 z-10" />

                        {toastMessage && (
                            <div className="absolute top-12 left-6 right-6 z-50 bg-emerald-900 text-emerald-50 text-xs px-4 py-3 rounded-2xl shadow-lg flex items-center justify-between">
                                <span>{toastMessage}</span>
                            </div>
                        )}

                        <div className="flex-1 overflow-y-auto px-6 pt-2 pb-28 relative flex flex-col">
                            
                            {activeTab === 'home' && (
                                <div className="flex-1 flex flex-col">
                                    <div className="mt-2 mb-6">
                                        <h1 className="text-3xl font-extrabold text-emerald-950 tracking-tight font-serif mb-1">
                                            JUNE'S JOURNAL
                                        </h1>
                                        <p className="text-sm font-semibold text-emerald-700/80 tracking-wide uppercase">
                                            {formattedDate}
                                        </p>
                                    </div>

                                    <div className="flex-1 bg-[#ffffff] rounded-3xl p-6 shadow-sm border border-emerald-900/5 relative overflow-hidden flex flex-col justify-between min-h-[380px]">
                                        <div 
                                            className="absolute inset-0 opacity-[0.03] pointer-events-none"
                                            style={{
                                                backgroundImage: 'radial-gradient(#064e3b 1px, transparent 1px)',
                                                backgroundSize: '16px 16px'
                                            }}
                                        />
                                        <div className="w-10 h-1 bg-emerald-800/20 rounded-full mb-4 mx-auto" />
                                        <div className="flex-1 flex items-center justify-center text-center">
                                            <p className="text-sm text-emerald-900/40 italic">记录今天发生的一切，AI 会自动帮你提炼体重与饮食哦...</p>
                                        </div>
                                        <div className="flex justify-end pt-4">
                                            <button
                                                onClick={() => setIsDialogOpen(true)}
                                                className="w-14 h-14 rounded-full bg-emerald-800 text-emerald-50 flex items-center justify-center shadow-lg active:scale-95"
                                            >
                                                <Plus size={28} strokeWidth={2.5} />
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            )}

                            {activeTab === 'learning' && (
                                <div className="flex-1 flex flex-col pt-1">
                                    <h2 className="text-2xl font-bold text-emerald-950 font-serif mb-4">Notebook</h2>

                                    <div className="relative mb-6">
                                        <div className="flex gap-2">
                                            <input
                                                type="text"
                                                value={inputWord}
                                                onChange={(e) => setInputWord(e.target.value)}
                                                placeholder="输入日语单词..."
                                                className="flex-1 px-4 py-3 rounded-2xl bg-white border border-emerald-900/10 text-emerald-950 placeholder:text-emerald-900/30 text-sm focus:outline-none shadow-sm"
                                            />
                                            <button
                                                onClick={handleParseWord}
                                                disabled={isParsing || !inputWord.trim()}
                                                className="w-12 h-12 rounded-2xl bg-emerald-800 text-emerald-50 flex items-center justify-center disabled:opacity-40 shrink-0 shadow"
                                            >
                                                <Plus size={20} strokeWidth={2.5} />
                                            </button>
                                        </div>
                                    </div>

                                    {pendingWord && (
                                        <div className="mb-6 p-5 rounded-2xl bg-emerald-900 text-emerald-50 shadow-xl relative">
                                            <div className="flex justify-between items-start mb-3">
                                                <div>
                                                    <span className="text-xs font-semibold uppercase tracking-wider text-emerald-300/80">解析确认</span>
                                                    <div className="flex items-baseline gap-2 mt-1">
                                                        <h3 className="text-2xl font-bold">{pendingWord.kanji}</h3>
                                                        <span className="text-xs text-emerald-200/80">[{pendingWord.kana}]</span>
                                                    </div>
                                                </div>
                                                <span className="px-2.5 py-1 rounded-full text-[11px] font-medium bg-emerald-800/80 text-emerald-200 border border-emerald-700/50">
                                                    {pendingWord.pos}
                                                </span>
                                            </div>
                                            <p className="text-sm text-emerald-100/90 mb-4 bg-emerald-950/40 p-3 rounded-xl">
                                                <span className="text-xs text-emerald-300 block mb-0.5">中文释义:</span>
                                                {pendingWord.meaning}
                                            </p>
                                            <div className="flex gap-2">
                                                <button onClick={() => setPendingWord(null)} className="flex-1 py-2.5 rounded-xl bg-emerald-800/60 text-emerald-200 text-xs font-medium">取消</button>
                                                <button onClick={handleConfirmWord} className="flex-1 py-2.5 rounded-xl bg-emerald-400 text-emerald-950 text-xs font-bold flex items-center justify-center gap-1">
                                                    <Check size={14} /> 确认存入
                                                </button>
                                            </div>
                                        </div>
                                    )}

                                    <div className="flex-1 space-y-3">
                                        <div className="flex justify-between items-center mb-1">
                                            <span className="text-xs font-bold text-emerald-900/60 uppercase tracking-wider">Japanese</span>
                                            <span className="text-xs text-emerald-800/40">{wordList.length} 词汇</span>
                                        </div>

                                        {wordList.map((item) => {
                                            var isExpanded = expandedWordId === item.id;
                                            var isEditingNote = noteEditingId === item.id;

                                            return (
                                                <div key={item.id} className="bg-white rounded-2xl border border-emerald-900/5 shadow-sm overflow-hidden">
                                                    <div onClick={() => setExpandedWordId(isExpanded ? null : item.id)} className="p-4 flex items-center justify-between cursor-pointer">
                                                        <div className="flex flex-col">
                                                            <div className="flex items-baseline gap-2">
                                                                <span className="text-lg font-bold text-emerald-950">{item.kanji}</span>
                                                                <span className="text-xs font-medium text-emerald-700/70">{item.kana}</span>
                                                            </div>
                                                            <span className="text-[10px] text-emerald-800/50 mt-0.5 font-medium">{item.pos}</span>
                                                        </div>
                                                        <div className="flex items-center gap-3">
                                                            <span className="text-sm font-medium text-emerald-900/80">{item.meaning}</span>
                                                            <div className="text-emerald-800/40">
                                                                {isExpanded ? <ChevronUp size={16} /> : <ChevronDown size={16} />}
                                                            </div>
                                                        </div>
                                                    </div>

                                                    {isExpanded && (
                                                        <div className="px-4 pb-4 pt-1 bg-[#fcfdfe] border-t border-emerald-900/5">
                                                            <div className="flex justify-end mb-2">
                                                                {!isEditingNote && (
                                                                    <button onClick={(e) => { e.stopPropagation(); setNoteEditingId(item.id); setTempNoteText(item.note); }} className="text-emerald-700 text-xs flex items-center gap-1 font-medium">
                                                                        <Edit3 size={12} /> {item.note ? '编辑' : '添加'}
                                                                    </button>
                                                                )}
                                                            </div>
                                                            {isEditingNote ? (
                                                                <div className="flex flex-col gap-2">
                                                                    <textarea
                                                                        value={tempNoteText}
                                                                        onChange={(e) => setTempNoteText(e.target.value)}
                                                                        placeholder="输入记忆巧门或笔记..."
                                                                        className="w-full p-2.5 rounded-xl text-xs bg-white border border-emerald-900/10 text-emerald-950 focus:outline-none"
                                                                        rows={2}
                                                                    />
                                                                    <div className="flex justify-end gap-2">
                                                                        <button onClick={() => setNoteEditingId(null)} className="px-3 py-1 rounded-lg text-xs text-emerald-800/60 bg-emerald-100/40">取消</button>
                                                                        <button onClick={() => { 
                                                                            setWordList(wordList.map(w => w.id === item.id ? Object.assign({}, w, { note: tempNoteText }) : w)); 
                                                                            setNoteEditingId(null); 
                                                                        }} className="px-3 py-1 rounded-lg text-xs text-emerald-50 bg-emerald-800">保存</button>
                                                                    </div>
                                                                </div>
                                                            ) : (
                                                                <div className="p-3 rounded-xl bg-emerald-50/50 border border-emerald-900/5 text-xs text-emerald-900/80 min-h-[36px]">
                                                                    {item.note ? <p className="whitespace-pre-wrap">{item.note}</p> : <span className="text-emerald-900/30 italic">点击右上角添加专属笔记...</span>}
                                                                </div>
                                                            )}
                                                        </div>
                                                    )}
                                                </div>
                                            );
                                        })}
                                    </div>
                                </div>
                            )}

                            {activeTab === 'health' && (
                                <div className="flex-1 flex flex-col pt-1 space-y-5">
                                    <h2 className="text-2xl font-bold text-emerald-950 font-serif">Health</h2>

                                    <div className="bg-white rounded-2xl p-4 border border-emerald-900/5 shadow-sm">
                                        <div className="flex justify-between items-center mb-3">
                                            <span className="text-xs font-bold text-emerald-900/60 uppercase tracking-wider">体重趋势 (斤)</span>
                                            <span className="text-xs font-bold text-emerald-800">
                                                当前: {latestWeight} 斤
                                            </span>
                                        </div>

                                        <div className="h-28 w-full flex items-end gap-3 pt-4 pb-2 px-2 border-b border-emerald-900/5 bg-emerald-50/30 rounded-xl mb-3">
                                            {weightList.map((item, idx) => {
                                                var minW = 90;
                                                var maxW = 140;
                                                var heightPct = Math.max(15, Math.min(100, ((item.weight - minW) / (maxW - minW)) * 100));
                                                return (
                                                    <div key={idx} className="flex-1 flex flex-col items-center gap-1 h-full justify-end group">
                                                        <span className="text-[10px] text-emerald-900/60 opacity-0 group-hover:opacity-100 font-mono">{item.weight}</span>
                                                        <div className="w-full bg-emerald-700/80 rounded-t-lg" style={{ height: heightPct + '%' }} />
                                                        <span className="text-[9px] text-emerald-900/40 truncate w-full text-center">{item.date.slice(5)}</span>
                                                    </div>
                                                );
                                            })}
                                        </div>

                                        <div className="flex gap-2">
                                            <input
                                                type="number"
                                                step="0.1"
                                                value={weightInput}
                                                onChange={(e) => setWeightInput(e.target.value)}
                                                placeholder="输入今日体重 (斤)..."
                                                className="flex-1 px-3 py-2 rounded-xl bg-emerald-50/50 border border-emerald-900/10 text-emerald-950 text-xs focus:outline-none"
                                            />
                                            <button
                                                onClick={handleAddWeight}
                                                className="w-10 h-10 rounded-xl bg-emerald-800 text-emerald-50 flex items-center justify-center shrink-0 shadow"
                                            >
                                                <Plus size={18} strokeWidth={2.5} />
                                            </button>
                                        </div>
                                    </div>

                                    <div className="bg-white rounded-2xl p-4 border border-emerald-900/5 shadow-sm flex-1 flex flex-col">
                                        <div className="flex justify-between items-center mb-3">
                                            <span className="text-xs font-bold text-emerald-900/60 uppercase tracking-wider">饮食记录</span>
                                            <span className="text-xs text-emerald-800/40">{dietList.length} 条记录</span>
                                        </div>

                                        <div className="flex gap-2 mb-3">
                                            <input
                                                type="text"
                                                value={dietInput}
                                                onChange={(e) => setDietInput(e.target.value)}
                                                placeholder="记录饮食 (如: 午餐 蔬菜沙拉)..."
                                                className="flex-1 px-3 py-2 rounded-xl bg-emerald-50/50 border border-emerald-900/10 text-emerald-950 text-xs focus:outline-none"
                                            />
                                            <button
                                                onClick={handleAddDiet}
                                                className="w-10 h-10 rounded-xl bg-emerald-800 text-emerald-50 flex items-center justify-center shrink-0 shadow"
                                            >
                                                <Plus size={18} strokeWidth={2.5} />
                                            </button>
                                        </div>

                                        <div className="space-y-2 overflow-y-auto max-h-48 pr-1">
                                            {dietList.map((diet) => (
                                                <div key={diet.id} className="flex items-center justify-between p-3 rounded-xl bg-emerald-50/40 border border-emerald-950/5">
                                                    <div>
                                                        <p className="text-xs font-medium text-emerald-950">{diet.content}</p>
                                                        <span className="text-[10px] text-emerald-800/50">{diet.time}</span>
                                                    </div>
                                                    <button
                                                        onClick={() => setDietList(dietList.filter(d => d.id !== diet.id))}
                                                        className="text-emerald-900/30 hover:text-red-500 p-1"
                                                    >
                                                        <Trash2 size={15} />
                                                    </button>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                </div>
                            )}

                            {activeTab === 'finance' && (
                                <div className="py-12 flex flex-col items-center justify-center flex-1 text-emerald-800/60">
                                    <Wallet size={40} className="mb-2 opacity-40" />
                                    <p className="text-sm font-medium">Finance</p>
                                </div>
                            )}

                            {activeTab === 'calendar' && (
                                <div className="py-12 flex flex-col items-center justify-center flex-1 text-emerald-800/60">
                                    <Calendar size={40} className="mb-2 opacity-40" />
                                    <p className="text-sm font-medium">Calendar</p>
                                </div>
                            )}

                        </div>

                        <div className="absolute bottom-0 left-0 right-0 h-20 bg-white/90 backdrop-blur-md border-t border-emerald-900/5 px-6 flex items-center justify-between z-30">
                            <button onClick={() => setActiveTab('finance')} className={`p-3 rounded-2xl ${activeTab === 'finance' ? 'text-emerald-800 bg-emerald-100/60' : 'text-emerald-900/40'}`}>
                                <Wallet size={24} strokeWidth={activeTab === 'finance' ? 2.5 : 2} />
                            </button>
                            <button onClick={() => setActiveTab('health')} className={`p-3 rounded-2xl ${activeTab === 'health' ? 'text-emerald-800 bg-emerald-100/60' : 'text-emerald-900/40'}`}>
                                <Heart size={24} strokeWidth={activeTab === 'health' ? 2.5 : 2} />
                            </button>
                            <button onClick={() => setActiveTab('home')} className={`p-3.5 rounded-2xl ${activeTab === 'home' ? 'text-emerald-50 bg-emerald-800 shadow-md scale-105' : 'text-emerald-900/40'}`}>
                                <BookOpen size={24} strokeWidth={activeTab === 'home' ? 2.5 : 2} />
                            </button>
                            <button onClick={() => setActiveTab('learning')} className={`p-3 rounded-2xl ${activeTab === 'learning' ? 'text-emerald-800 bg-emerald-100/60' : 'text-emerald-900/40'}`}>
                                <BookMarked size={24} strokeWidth={activeTab === 'learning' ? 2.5 : 2} />
                            </button>
                            <button onClick={() => setActiveTab('calendar')} className={`p-3 rounded-2xl ${activeTab === 'calendar' ? 'text-emerald-800 bg-emerald-100/60' : 'text-emerald-900/40'}`}>
                                <Calendar size={24} strokeWidth={activeTab === 'calendar' ? 2.5 : 2} />
                            </button>
                        </div>

                        {isDialogOpen && (
                            <div className="absolute inset-0 z-50 bg-emerald-950/20 backdrop-blur-sm flex flex-col justify-end">
                                <div className="absolute inset-0" onClick={() => setIsDialogOpen(false)} />
                                <div className="relative bg-[#ffffff] rounded-t-[32px] p-6 shadow-2xl border-t border-emerald-900/10 flex flex-col gap-4 max-h-[80%] z-10">
                                    <div className="flex justify-between items-center pb-2">
                                        <span className="text-sm font-semibold text-emerald-900/60">New Entry</span>
                                        <button onClick={() => setIsDialogOpen(false)} className="w-8 h-8 rounded-full bg-emerald-100/50 flex items-center justify-center text-emerald-800">
                                            <X size={18} />
                                        </button>
                                    </div>
                                    <textarea
                                        value={diaryText}
                                        onChange={(e) => setDiaryText(e.target.value)}
                                        placeholder="记录今天的心情、体重(如 114斤)或饮食..."
                                        className="w-full h-40 p-4 rounded-2xl bg-[#f8faf8] border border-emerald-900/10 text-emerald-950 placeholder:text-emerald-900/30 focus:outline-none resize-none text-base"
                                        autoFocus
                                    />
                                    <button
                                        onClick={handleSaveDiary}
                                        className="w-full py-3.5 rounded-2xl bg-emerald-800 text-emerald-50 font-medium flex items-center justify-center gap-2 shadow-md"
                                    >
                                        <span>Save</span>
                                        <Send size={18} />
                                    </button>
                                </div>
                            </div>
                        )}

                    </div>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
