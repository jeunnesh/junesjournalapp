<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>June's Journal</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-[#e8ede9] m-0 p-0 overflow-hidden select-none font-sans">
    <div id="app" class="flex justify-center items-center h-[100vh] w-[100vw] bg-[#e8ede9]">
        <!-- 手机外壳 -->
        <div class="relative w-full h-full md:max-w-md md:h-[844px] bg-[#f8faf8] md:rounded-[40px] shadow-2xl flex flex-col overflow-hidden border-0 md:border-[8px] md:border-emerald-900/10">
            
            <!-- 状态栏高度 -->
            <div class="h-10 w-full bg-[#f8faf8] shrink-0 z-10"></div>

            <!-- Toast 提示框 -->
            <div id="toast" class="hidden absolute top-12 left-6 right-6 z-50 bg-emerald-900 text-emerald-50 text-xs px-4 py-3 rounded-2xl shadow-lg flex items-center justify-between transition-all">
                <span id="toast-text">✨ 提示信息</span>
            </div>

            <!-- 主内容滚动区 -->
            <div id="content-area" class="flex-1 overflow-y-auto px-6 pt-2 pb-28 relative flex flex-col">
                <!-- 动态渲染的 Tab 内容 -->
            </div>

            <!-- 底部悬浮 Tab 栏 -->
            <div class="absolute bottom-0 left-0 right-0 h-20 bg-white/95 backdrop-blur-md border-t border-emerald-900/5 px-6 flex items-center justify-between z-30">
                <button onclick="switchTab('finance')" id="tab-btn-finance" class="p-3 rounded-2xl text-emerald-900/40 transition-all"><i data-lucide="wallet" class="w-6 h-6"></i></button>
                <button onclick="switchTab('health')" id="tab-btn-health" class="p-3 rounded-2xl text-emerald-900/40 transition-all"><i data-lucide="heart" class="w-6 h-6"></i></button>
                <button onclick="switchTab('home')" id="tab-btn-home" class="p-3.5 rounded-2xl text-emerald-50 bg-emerald-800 shadow-md scale-105 transition-all"><i data-lucide="book-open" class="w-6 h-6"></i></button>
                <button onclick="switchTab('learning')" id="tab-btn-learning" class="p-3 rounded-2xl text-emerald-900/40 transition-all"><i data-lucide="book-marked" class="w-6 h-6"></i></button>
                <button onclick="switchTab('calendar')" id="tab-btn-calendar" class="p-3 rounded-2xl text-emerald-900/40 transition-all"><i data-lucide="calendar" class="w-6 h-6"></i></button>
            </div>

            <!-- 首页日记弹窗 -->
            <div id="diary-dialog" class="hidden absolute inset-0 z-50 bg-emerald-950/20 backdrop-blur-sm flex flex-col justify-end">
                <div class="absolute inset-0" onclick="closeDiaryDialog()"></div>
                <div class="relative bg-[#ffffff] rounded-t-[32px] p-6 shadow-2xl border-t border-emerald-900/10 flex flex-col gap-4 max-h-[80%] z-10">
                    <div class="flex justify-between items-center pb-2">
                        <span class="text-sm font-semibold text-emerald-900/60">New Entry</span>
                        <button onclick="closeDiaryDialog()" class="w-8 h-8 rounded-full bg-emerald-100/50 flex items-center justify-center text-emerald-800"><i data-lucide="x" class="w-4 h-4"></i></button>
                    </div>
                    <textarea id="diary-input" placeholder="记录今天的心情、体重(如 114斤)或饮食..." class="w-full h-40 p-4 rounded-2xl bg-[#f8faf8] border border-emerald-900/10 text-emerald-950 placeholder:text-emerald-900/30 focus:outline-none resize-none text-base"></textarea>
                    <button onclick="saveDiary()" class="w-full py-3.5 rounded-2xl bg-emerald-800 text-emerald-50 font-medium flex items-center justify-center gap-2 shadow-md">
                        <span>Save</span> <i data-lucide="send" class="w-4 h-4"></i>
                    </button>
